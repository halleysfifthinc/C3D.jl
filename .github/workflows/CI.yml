name: CI
on:
  push:
    branches:
      - master
      - main
      - 'release*'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
  workflow_dispatch:

concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  compute-test-matrix:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      test-matrix: ${{ steps.matrix.outputs.test-matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: matrix
        uses: julia-actions/julia-compute-test-matrix@cfcfd7bc02d7aed71869fde5e0e6dddc28084ffc # v2 branch (untagged)
        with:
          include-rc-versions: true
          include-beta-versions: true
          include-windows-x64: false
          include-windows-x86: false
          include-linux-x86: false
          include-macos-x64: false
          include-macos-aarch64: false
          allow-failure: none

  test:
    name: Julia ${{ matrix.juliaup-channel }} - ${{ github.event_name }}
    needs: compute-test-matrix
    runs-on: ${{ matrix.os }}
    # needed to allow julia-actions/cache to delete old caches that it has created
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.compute-test-matrix.outputs.test-matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: julia-actions/install-juliaup@8d13b44e0eb1620c4e2d2d0a4ceee7d98100b955 # v3.1.6
        with:
          channel: ${{ matrix.juliaup-channel }}
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
      # - name: Resolve pre-release environment
      #   if: startsWith(matrix.juliaup-channel, 'rc')
      #   shell: julia --project=test --color=yes {0}
      #   # edit test/Project using TOML because of a Pkg.rm bug
      #   run: |
      #       using TOML
      #       test_project = "test/Project.toml"
      #       d = TOML.parsefile(test_project)
      #       delete!(d["deps"], "JET")
      #       delete!(d["compat"], "JET")
      #       open(test_project, "w") do io
      #           TOML.print(io, d)
      #       end
      #       using Pkg
      #       Pkg.update()
      - uses: halleysfifthinc/julia-run-testitems@b4f7e79272e380b96c2803e749f23e752f7c0751 # main branch
        with:
          juliaup-channel: ${{ matrix.juliaup-channel }}
          check-bounds: 'yes'
          coverage-lcov-path: lcov.info
          run-stall: 600
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          disable_search: true

